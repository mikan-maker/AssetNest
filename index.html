<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AssetNest - Free High-Quality Transparent PNGs</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Google Fonts (Inter & Outfit) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    h1, h2, h3, .font-heading { font-family: 'Outfit', sans-serif; }
    /* 市松模様のチェッカーボード（透明PNG背景） */
    .bg-checker {
      background-color: #0b0f19;
      background-image: 
        linear-gradient(45deg, #131b2e 25%, transparent 25%), 
        linear-gradient(-45deg, #131b2e 25%, transparent 25%), 
        linear-gradient(45deg, transparent 75%, #131b2e 75%), 
        linear-gradient(-45deg, transparent 75%, #131b2e 75%);
      background-size: 16px 16px;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
    }
    .modal-backdrop {
      backdrop-filter: blur(12px);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col selection:bg-cyan-500 selection:text-slate-950">

  <!-- ヘッダー -->
  <header class="sticky top-0 z-40 bg-slate-950/80 backdrop-blur-md border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      <a href="#" class="flex items-center gap-3 group">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-400 via-sky-500 to-blue-600 flex items-center justify-center shadow-lg transform group-hover:scale-105 transition">
          <i data-lucide="layers" class="w-6 h-6 text-slate-950"></i>
        </div>
        <div>
          <span class="text-xl font-extrabold tracking-tight font-heading text-white block group-hover:text-cyan-400 transition">AssetNest</span>
          <span class="text-xs text-slate-400 hidden sm:block">Free High-Quality Transparent PNGs</span>
        </div>
      </a>
      <div class="flex items-center gap-4">
        <span class="text-xs px-3 py-1.5 rounded-full bg-cyan-500/10 text-cyan-400 border-cyan-500/20 font-medium flex items-center gap-1.5">
          <i data-lucide="sparkles" class="w-3.5 h-3.5"></i> すべて商用・無料利用可
        </span>
      </div>
    </div>
  </header>

  <!-- ヒーローセクション -->
  <section class="relative pt-12 pb-16 px-4 sm:px-6 lg:px-8 border-b border-slate-800/80 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-slate-950">
    <div class="max-w-4xl mx-auto text-center space-y-6">
      <h1 class="text-3xl sm:text-5xl font-extrabold tracking-tight font-heading">
        クリエイティブを加速する、<br>
        <span class="bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 via-sky-500 to-blue-600">美しい透明PNG素材ライブラリ</span>
      </h1>
      <p class="text-sm sm:text-base text-slate-400 max-w-2xl mx-auto leading-relaxed">
        Webサイト・アプリ・デザイン制作ですぐに使える高画質な透過PNGイラスト・アイコン素材を完全無料で配布しています。
      </p>

      <!-- リアルタイム検索バー -->
      <div class="max-w-2xl mx-auto pt-4">
        <div class="relative">
          <i data-lucide="search" class="w-5 h-5 absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"></i>
          <input type="text" id="searchInput" placeholder="素材名やタグでリアルタイム検索..." class="w-full pl-12 pr-4 py-4 rounded-2xl bg-slate-900/90 border border-slate-700/80 text-white placeholder-slate-500 shadow-2xl focus:outline-none focus:border-cyan-500 transition text-sm sm:text-base">
        </div>
      </div>

      <!-- タグクラウドフィルター -->
      <div id="tagFilters" class="flex flex-wrap items-center justify-center gap-2 pt-2">
        <!-- JSで動的生成 -->
      </div>
    </div>
  </section>

  <!-- 素材グリッドエリア -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <div class="flex items-center justify-between mb-8">
      <div>
        <h2 class="text-xl font-bold font-heading text-white">配布中のPNG素材</h2>
        <p class="text-xs text-slate-400 mt-1" id="itemsCountDisplay">全アイテムを表示中</p>
      </div>
    </div>

    <!-- グリッドコンテナ -->
    <div id="materialsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      <!-- JSで素材カードを自動レンダリング -->
    </div>

    <!-- 検索結果が空のとき -->
    <div id="emptyState" class="hidden text-center py-20">
      <div class="w-16 h-16 mx-auto rounded-full bg-slate-900 border border-slate-800 flex items-center justify-center text-slate-500 mb-4">
        <i data-lucide="inbox" class="w-8 h-8"></i>
      </div>
      <h3 class="text-base font-semibold text-slate-300">該当する素材が見つかりませんでした</h3>
      <p class="text-xs text-slate-500 mt-1">別のキーワードやタグをお試しください。</p>
    </div>
  </main>

  <!-- 詳細・プレビューモーダル -->
  <div id="detailModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 modal-backdrop bg-slate-950/70 hidden transition-opacity duration-200 opacity-0">
    <div class="bg-slate-900 border border-slate-800 rounded-3xl max-w-2xl w-full overflow-hidden shadow-2xl relative transform transition-transform duration-200 scale-95" id="modalCard">
      <!-- 閉じるボタン -->
      <button onclick="closeModal()" class="absolute top-4 right-4 z-10 w-9 h-9 rounded-full bg-slate-800/80 hover:bg-slate-700 text-slate-300 flex items-center justify-center transition">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>

      <div class="p-6 sm:p-8">
        <!-- 透過プレビュー枠 -->
        <div class="w-full h-72 sm:h-80 bg-checker rounded-2xl flex items-center justify-center p-6 border border-slate-800 relative group overflow-hidden">
          <img id="modalImg" src="" alt="" class="max-w-full max-h-full object-contain filter drop-shadow-2xl transition transform group-hover:scale-105 duration-300">
        </div>

        <!-- 素材情報 -->
        <div class="mt-6 space-y-4">
          <div class="flex items-start justify-between gap-4">
            <div>
              <span id="modalLicense" class="text-[11px] font-semibold px-2.5 py-1 rounded-md bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 inline-block mb-2"></span>
              <h3 id="modalTitle" class="text-2xl font-bold font-heading text-white"></h3>
            </div>
            <button onclick="downloadCurrentImage()" class="flex-shrink-0 flex items-center gap-2 px-5 py-3 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-semibold shadow-cyan-500/25 transition shadow-lg">
              <i data-lucide="download" class="w-4 h-4"></i>
              <span>PNGを保存</span>
            </button>
          </div>

          <p id="modalDesc" class="text-sm text-slate-400 leading-relaxed"></p>

          <div class="flex items-center gap-2 pt-2 border-t border-slate-800">
            <span class="text-xs text-slate-500">タグ:</span>
            <div id="modalTags" class="flex flex-wrap gap-1.5"></div>
          </div>

          <!-- 個別URL共有リンク -->
          <div class="pt-2">
            <button onclick="copyShareUrl()" class="text-xs text-slate-400 hover:text-cyan-400 flex items-center gap-1.5 transition">
              <i data-lucide="link" class="w-3.5 h-3.5"></i> この素材の直リンクをコピー
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- フッター -->
  <footer class="border-t border-slate-900 bg-slate-950 py-8 px-4 text-center text-xs text-slate-500">
    <p>© 2026 AssetNest. Powered by PixCraft Studio.</p>
  </footer>

  <!-- サイトスクリプト -->
  <script>
    const items = [{"id":1793002691856,"title":"ディズニー風の3D立体日本人青年イラスト、ガッチリした体格の学生オブジェクトと黒いTシャツ、プレミアム透過png","url":"https://github.com/mikan-maker/AssetNest/blob/main/IMG_3363.jpeg?raw=true","slug":"3d-disney-style-japanese-young-man-asset_114514","tags":"劇場の背景, 迫真の先輩, 24歳の学生, ディズニー風3D, 王道のポーズ, 3D","license":"商用利用可・クレジット不要","description":"劇場の背景に最適な、ディズニー風3D日本人青年（24歳学生）アセット。 ガッチリした体格と黒いシャツが、114514%の迫真の存在感を演出します。"},{"id":1793002629388,"title":"視認可能な3dの壊れた野球スコアボード、文字を隠さない現実的なひび割れと鮮明な33-4、プレミアム透過pngリソース","url":"https://github.com/mikan-maker/AssetNest/blob/main/IMG_3360.png?raw=true","slug":"3d-readable-score-33-4-slight-crack-screen_114514","tags":"スポーツの敗北, 電光掲示板, 適切な破壊, 視認できる33-4, 画面のひび割れ","license":"商用利用可・クレジット不要","description":"大敗の絶望的なバナー、スポーツのミームの背景、およびなんでや！の感情的なポストに最適です。"},{"id":1793000952205,"title":"現実的な3Dアイスティーの画像、冷たいガラスのコップと黒塗りの高級車（誤訳）、アイスティーしかなかったけどいいかな？プレミアムテンプレートpng","url":"https://github.com/mikan-maker/AssetNest/blob/main/IMG_3358.png?raw=true","slug":"asset-3d-realistic-ice-tea-glass-only-ice-tea-ok_114514","tags":"冷たい飲み物, 夏のライフスタイル, 迫真のグラフィック, 昏睡のブレイクタイム, 王道のアート","license":"商用利用可・クレジット不要","description":"この高品質なアイスティーの画像は、喉が渇いたときのポスター、真夏のウェブバナー、および114514%のクリエイティブなグラフィックに最適です。"},{"id":1,"title":"クリエイティブな3Dのthank you文字、ネオンライト効果を持つ未来的なアルファベット、感謝カードのテンプレート","url":"https://github.com/mikan-maker/AssetNest/blob/main/IMG_3310.png?raw=true","slug":"3d-thankyou-text","tags":"3D, アルファベット, 感謝, thank you, ありがとう","license":"商用利用可・クレジット不要","description":"このプレミアムな3Dのthank youアルファベット文字は、商業目的の感謝カード、誕生日おめでとうの背景、およびソーシャルメディア of ポストに最適です。"},{"id":2,"title":"現代的な3D立体ガラスキューブの背景、現実的な透明なスクエアブロック、光の屈折とプレミアイラストpngテンプレート","url":"https://github.com/mikan-maker/AssetNest/blob/main/IMG_3321.png?raw=true","slug":"glass-cube-3d","tags":"3D, ガラス, アイコン","license":"商用利用可・クレジット不要","description":"この高品質な3D立体ガラスキューブは、テクノロジーの抽象的な背景、ビジネスのプレゼンテーション、および未来的なUIデザインの要素に最適です。"},{"id":3,"title":"現実的な3Dうんこのイラスト、漫画の茶色いお辞儀のオブジェクトと飛び回るハエの昆虫、ユーモアの背景プレミアムpng透過","url":"https://github.com/mikan-maker/AssetNest/blob/main/IMG_3323.png?raw=true","slug":"poop-real-1","tags":"うんこ, 可愛い, 3D, お前の顔と同等, かっこいい, イケメン, 垢抜け男子","license":"商用利用可・クレジット不要","description":"この高品質な3Dうんことハエのイラストは、ジョークのグラフィックデザイン、面白いソーシャルメディアのポスト、および警告のバナーの要素に最適です。"},{"id":4,"title":"輝く3D絵文字の嘔吐イラスト、不快な感情の顔のオブジェクトと緑色の現実的なゲロ、プレミアム透過pngテンプレート","url":"https://github.com/mikan-maker/AssetNest/blob/main/IMG_3329.png?raw=true","slug":"VomitingFace-3D-1","tags":"感情と絵文字, 医療と健康, 抽象的なアート, 現代のライフスタイル, 液体シミュレーション","license":"商用利用可・クレジット不要","description":"この高品質な3D絵文字の嘔吐は、二日酔いの警告バナー、サイケデリックなパーティーのチラシ、および感情的なソーシャルメディアのポストに最適です。"}];
    let currentSelectedTag = 'ALL';
    let currentModalItem = null;

    const materialsGrid = document.getElementById('materialsGrid');
    const searchInput = document.getElementById('searchInput');
    const tagFilters = document.getElementById('tagFilters');
    const emptyState = document.getElementById('emptyState');
    const itemsCountDisplay = document.getElementById('itemsCountDisplay');
    const detailModal = document.getElementById('detailModal');
    const modalCard = document.getElementById('modalCard');

    // タグ一覧を抽出
    function initTags() {
      const tagSet = new Set();
      items.forEach(item => {
        if (item.tags) {
          item.tags.split(',').map(t => t.trim()).filter(Boolean).forEach(t => tagSet.add(t));
        }
      });

      tagFilters.innerHTML = '';
      
      // 「すべて」ボタン
      const allBtn = document.createElement('button');
      allBtn.className = 'px-3 py-1.5 rounded-full text-xs transition border ' + (currentSelectedTag === 'ALL' ? 'bg-cyan-500 text-slate-950 font-bold border-transparent' : 'bg-slate-900 text-slate-400 border-slate-800 hover:border-slate-700');
      allBtn.innerText = 'すべて';
      allBtn.onclick = () => selectTag('ALL');
      tagFilters.appendChild(allBtn);

      tagSet.forEach(tag => {
        const btn = document.createElement('button');
        btn.className = 'px-3 py-1.5 rounded-full text-xs transition border ' + (currentSelectedTag === tag ? 'bg-cyan-500 text-slate-950 font-bold border-transparent' : 'bg-slate-900 text-slate-400 border-slate-800 hover:border-slate-700');
        btn.innerText = '#' + tag;
        btn.onclick = () => selectTag(tag);
        tagFilters.appendChild(btn);
      });
    }

    function selectTag(tag) {
      currentSelectedTag = tag;
      initTags();
      renderItems();
    }

    // アイテムレンダリング
    function renderItems() {
      const query = searchInput.value.toLowerCase().trim();
      const filtered = items.filter(item => {
        const matchesQuery = item.title.toLowerCase().includes(query) || 
                             item.description.toLowerCase().includes(query) || 
                             (item.tags && item.tags.toLowerCase().includes(query));
        const matchesTag = currentSelectedTag === 'ALL' || 
                           (item.tags && item.tags.split(',').map(t => t.trim()).includes(currentSelectedTag));
        return matchesQuery && matchesTag;
      });

      materialsGrid.innerHTML = '';
      itemsCountDisplay.innerText = `${filtered.length} 件の素材を表示中`;

      if (filtered.length === 0) {
        emptyState.classList.remove('hidden');
      } else {
        emptyState.classList.add('hidden');
        filtered.forEach(item => {
          const card = document.createElement('div');
          card.className = 'bg-slate-900/90 rounded-2xl border border-slate-800/80 overflow-hidden hover:border-slate-700 transition duration-300 hover:shadow-xl group flex flex-col cursor-pointer';
          card.onclick = () => openModal(item);

          card.innerHTML = `
            <div class="h-48 w-full bg-checker p-4 flex items-center justify-center relative overflow-hidden">
              <img src="${item.url}" alt="${item.title}" class="max-w-full max-h-full object-contain filter drop-shadow group-hover:scale-105 transition duration-300">
              <span class="absolute top-3 left-3 text-[10px] font-semibold px-2 py-0.5 rounded bg-slate-950/80 text-slate-300 border border-slate-800 backdrop-blur">
                ${item.license}
              </span>
            </div>
            <div class="p-4 flex-1 flex flex-col justify-between">
              <div>
                <h3 class="text-sm font-bold text-white group-hover:text-cyan-400 transition line-clamp-1">${item.title}</h3>
                <p class="text-xs text-slate-400 mt-1 line-clamp-2">${item.description}</p>
              </div>
              <div class="mt-4 pt-3 border-t border-slate-800/80 flex items-center justify-between">
                <span class="text-[11px] text-slate-500 font-mono">#${item.slug}</span>
                <button onclick="event.stopPropagation(); triggerDownload('${item.url}', '${item.slug || 'download'}')" class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 transition" title="ダウンロード">
                  <i data-lucide="download" class="w-4 h-4"></i>
                </button>
              </div>
            </div>
          `;
          materialsGrid.appendChild(card);
        });
      }

      lucide.createIcons();
    }

    // モーダル操作
    function openModal(item) {
      currentModalItem = item;
      document.getElementById('modalImg').src = item.url;
      document.getElementById('modalTitle').innerText = item.title;
      document.getElementById('modalDesc').innerText = item.description;
      document.getElementById('modalLicense').innerText = item.license;

      const modalTags = document.getElementById('modalTags');
      modalTags.innerHTML = '';
      if (item.tags) {
        item.tags.split(',').forEach(tag => {
          const span = document.createElement('span');
          span.className = 'text-[11px] px-2 py-0.5 rounded bg-slate-800 text-slate-300';
          span.innerText = '#' + tag.trim();
          modalTags.appendChild(span);
        });
      }

      // ハッシュURL更新
      window.location.hash = item.slug;

      detailModal.classList.remove('hidden');
      setTimeout(() => {
        detailModal.classList.remove('opacity-0');
        modalCard.classList.remove('scale-95');
      }, 10);

      lucide.createIcons();
    }

    function closeModal() {
      detailModal.classList.add('opacity-0');
      modalCard.classList.add('scale-95');
      setTimeout(() => {
        detailModal.classList.add('hidden');
        window.history.replaceState(null, null, ' ');
      }, 200);
    }

    detailModal.onclick = (e) => {
      if (e.target === detailModal) closeModal();
    };

    // ダウンロード実行
    function triggerDownload(url, filename) {
      fetch(url)
        .then(response => response.blob())
        .then(blob => {
          const blobUrl = window.URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = blobUrl;
          a.download = (filename || 'asset') + '.png';
          document.body.appendChild(a);
          a.click();
          a.remove();
          window.URL.revokeObjectURL(blobUrl);
        })
        .catch(() => {
          // CORS等の理由でBlob取得に失敗した場合は別タブで開く
          window.open(url, '_blank');
        });
    }

    function downloadCurrentImage() {
      if (currentModalItem) {
        triggerDownload(currentModalItem.url, currentModalItem.slug);
      }
    }

    function copyShareUrl() {
      const shareUrl = window.location.href;
      navigator.clipboard.writeText(shareUrl).then(() => {
        alert('素材のURLをクリップボードにコピーしました！');
      });
    }

    // ハッシュリンクによる自動モーダル起動（例: #cats-01）
    function checkUrlHash() {
      const hash = window.location.hash.replace('#', '');
      if (hash) {
        const found = items.find(i => i.slug === hash);
        if (found) openModal(found);
      }
    }

    // イベント設定
    searchInput.addEventListener('input', renderItems);
    window.addEventListener('load', () => {
      initTags();
      renderItems();
      checkUrlHash();
    });
  </script>
</body>
</html>
